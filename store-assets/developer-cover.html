<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:4096px; height:2304px; overflow:hidden; font-family:'Manrope',sans-serif; }
  .banner {
    width:4096px; height:2304px; position:relative;
    background:linear-gradient(135deg, #0057B7 0%, #0066D6 55%, #1A7AE8 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .pattern {
    position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(circle, rgba(255,255,255,0.07) 4px, transparent 4px);
    background-size:88px 88px;
  }
  .icon {
    width:620px; height:620px; border-radius:130px; flex-shrink:0;
    position:relative; overflow:hidden; z-index:2;
    box-shadow:0 46px 130px rgba(0,0,0,0.28);
    margin-bottom:96px;
  }
  .icon .blue { position:absolute; inset:0; background:#0057B7; }
  .icon .yellow { position:absolute; left:0; right:0; bottom:0; height:25%; background:#FCD400; }
  .icon .letter {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:400px; letter-spacing:0; transform:scale(1.08,1.06);
  }
  .title { font-size:152px; font-weight:900; color:#fff; letter-spacing:-3px; line-height:1; margin-bottom:48px; z-index:2; }
  .tagline { font-size:60px; font-weight:700; color:rgba(255,255,255,0.88); line-height:1.4; text-align:center; z-index:2; }
</style>
</head>
<body>
  <div class="banner">
    <div class="pattern"></div>
    <div class="icon">
      <div class="blue"></div>
      <div class="yellow"></div>
      <div class="letter">R</div>
    </div>
    <div class="title">RAZOM</div>
    <div class="tagline">Довідник для українців у Нідерландах</div>
  </div>
</body>
</html>
