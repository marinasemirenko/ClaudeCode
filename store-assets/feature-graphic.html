<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1024px; height:500px; overflow:hidden; font-family:'Manrope',sans-serif; }
  .banner {
    width:1024px; height:500px; position:relative;
    background:linear-gradient(135deg, #0057B7 0%, #0066D6 55%, #1A7AE8 100%);
    display:flex; align-items:center; gap:56px;
    padding:0 72px;
  }
  .yellow-stripe {
    position:absolute; left:0; right:0; bottom:0; height:54px;
    background:#FCD400;
  }
  .pattern {
    position:absolute; inset:0; pointer-events:none;
    background-image:radial-gradient(circle, rgba(255,255,255,0.07) 1.6px, transparent 1.6px);
    background-size:34px 34px;
  }
  .icon {
    width:230px; height:230px; border-radius:48px; flex-shrink:0;
    position:relative; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,0.28);
    z-index:2;
  }
  .icon .blue { position:absolute; inset:0; background:#0057B7; }
  .icon .yellow { position:absolute; left:0; right:0; bottom:0; height:25%; background:#FCD400; }
  .icon .letter {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:148px; letter-spacing:0; transform:scale(1.08,1.06);
  }
  .text { z-index:2; }
  .title { font-size:64px; font-weight:900; color:#fff; letter-spacing:-1.5px; line-height:1.05; margin-bottom:14px; }
  .tagline { font-size:25px; font-weight:600; color:rgba(255,255,255,0.88); line-height:1.4; max-width:540px; }
  .badge {
    display:inline-flex; align-items:center; gap:8px; margin-top:22px;
    background:rgba(255,255,255,0.16); border:1.5px solid rgba(255,255,255,0.35);
    border-radius:100px; padding:9px 20px; font-size:18px; font-weight:700; color:#fff;
  }
  .badge .dot { width:9px; height:9px; border-radius:50%; background:#FCD400; }
</style>
</head>
<body>
  <div class="banner">
    <div class="pattern"></div>
    <div class="icon">
      <div class="blue"></div>
      <div class="yellow"></div>
      <div class="letter">R</div>
    </div>
    <div class="text">
      <div class="title">RAZOM</div>
      <div class="tagline">Довідник для українських біженців у Нідерландах — закони, медицина, житло, робота і перші кроки в одному місці.</div>
    </div>
    <div class="yellow-stripe"></div>
  </div>
</body>
</html>
