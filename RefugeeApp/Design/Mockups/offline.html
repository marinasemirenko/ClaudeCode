<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Немає з'єднання — RAZOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #0057B7; --yellow: #FCD400; --bg: #EFECE5;
      --text: #111827; --muted: #6B7280;
      --accent: #4F46E5; --accent-soft: #EEF2FF;
    }
    body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .msym { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; font-size: 22px; line-height: 1; }
    .flag-bar { height: 3px; background: linear-gradient(90deg, var(--blue) 50%, var(--yellow) 50%); flex-shrink: 0; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 32px; text-align: center; }
    .offline-icon { width: 72px; height: 72px; border-radius: 22px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .offline-icon .msym { font-size: 36px; color: var(--accent); }
    .offline-title { font-size: 19px; font-weight: 900; letter-spacing: -0.3px; margin-bottom: 8px; }
    .offline-desc { font-size: 13px; color: var(--muted); font-weight: 500; line-height: 1.6; max-width: 260px; margin-bottom: 28px; }
    .retry-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: 14px; padding: 14px 28px; font-size: 14px; font-weight: 800; font-family: inherit; cursor: pointer; }
    .retry-btn .msym { font-size: 18px; font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  </style>
</head>
<body>

<div class="flag-bar"></div>

<main>
  <div class="offline-icon"><span class="msym">wifi_off</span></div>
  <div class="offline-title">Немає з'єднання з інтернетом</div>
  <div class="offline-desc">Перевір Wi-Fi або мобільний інтернет і спробуй ще раз.</div>
  <button class="retry-btn" onclick="location.reload()"><span class="msym">refresh</span>Спробувати знову</button>
</main>

</body>
</html>
