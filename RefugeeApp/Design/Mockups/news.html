<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Новини — RAZOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F8F9FA;
      --card: #FFFFFF;
      --text: #111827;
      --muted: #6B7280;
      --border: #E5E2DA;
      --blue: #0057B7;
      --blue-dark: #003DA6;
      --blue-soft: #E8F0FF;
      --yellow: #FCD400;
      --red: #DC2626;
    }

    body {
      font-family: 'Manrope', sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .msym {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 22px;
      line-height: 1;
      vertical-align: middle;
    }
    .msym.o { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }

    /* FLAG BAR */
    .flag-bar { height: 3px; background: linear-gradient(90deg, var(--blue) 50%, var(--yellow) 50%); }

    /* HEADER */
    header {
      background: var(--card);
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .back-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-btn .msym { font-size: 20px; color: var(--text); }

    .header-title {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      flex: 1;
    }

    .refresh-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--blue);
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,87,183,0.3);
    }
    .refresh-btn .msym { font-size: 18px; color: #fff; }
    .refresh-btn.loading .msym { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .header-status {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22C55E;
      flex-shrink: 0;
      animation: blink 2s infinite;
    }
    .live-dot.error   { background: var(--red); animation: none; }
    .live-dot.loading { background: var(--yellow); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .status-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      flex: 1;
    }

    /* FILTER BAR */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 85px;
      z-index: 40;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-tab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .filter-tab.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .health-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #D1D5DB;
      flex-shrink: 0;
    }
    .health-dot.green { background: #22C55E; }
    .health-dot.amber { background: #F59E0B; }
    .health-dot.red   { background: var(--red); }

    /* MAIN */
    main { padding: 14px 16px 120px; }

    /* ARTICLE CARDS */
    .article-card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1.5px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .article-card.article-unlocked:hover {
      border-color: var(--blue);
      box-shadow: 0 4px 16px rgba(0,87,183,0.1);
      transform: translateY(-1px);
    }
    .article-card.article-unlocked:active { transform: scale(0.98); }
    .article-card.article-locked { cursor: pointer; }
    .article-card.article-locked:active { transform: scale(0.98); }

    .article-card.featured {
      border-color: var(--blue);
      border-width: 2px;
      background: linear-gradient(135deg, #F0F5FF 0%, #fff 60%);
    }
    .article-card.featured .article-title { font-size: 15px; }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .cat-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .article-source {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .article-time {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      flex-shrink: 0;
    }

    .article-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 10px;
    }

    .article-read-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--blue);
    }
    .article-read-btn .msym { font-size: 14px; }

    .article-lock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      background: var(--bg);
      padding: 4px 10px;
      border-radius: 100px;
    }
    .article-lock .msym { font-size: 13px; }

    .transl-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 100px;
      padding: 2px 7px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    /* SKELETON */
    .skeleton-card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1.5px solid var(--border);
    }
    .skel-line {
      border-radius: 6px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e4e4e4 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skel-meta   { height: 10px; width: 55%; margin-bottom: 10px; }
    .skel-t1     { height: 14px; width: 96%; margin-bottom: 6px; }
    .skel-t2     { height: 14px; width: 72%; margin-bottom: 10px; }
    .skel-action { height: 10px; width: 28%; }

    /* PREMIUM BANNER */
    .premium-banner {
      background: linear-gradient(135deg, #003DA6 0%, #0057B7 100%);
      border-radius: 16px;
      padding: 18px;
      margin-top: 4px;
      text-align: center;
    }
    .pb-icon  { font-size: 28px; margin-bottom: 8px; }
    .pb-title { font-size: 14px; font-weight: 900; color: #fff; margin-bottom: 4px; }
    .pb-sub   { font-size: 11px; color: rgba(255,255,255,0.65); margin-bottom: 14px; line-height: 1.5; }
    .pb-btn {
      display: inline-block;
      background: var(--yellow);
      color: #5A3800;
      font-family: inherit;
      font-size: 12px;
      font-weight: 900;
      padding: 9px 22px;
      border-radius: 100px;
      text-decoration: none;
    }

    /* ERROR STATE */
    .error-state {
      text-align: center;
      padding: 48px 20px;
    }
    .error-icon  { font-size: 44px; margin-bottom: 12px; }
    .error-title { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
    .error-sub   { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }
    .error-retry {
      background: var(--blue);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 26px;
      border-radius: 100px;
      cursor: pointer;
    }

    /* PREMIUM MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modal-card {
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 28px 24px 44px;
      max-width: 390px;
      width: 100%;
      text-align: center;
    }
    .modal-icon  { font-size: 42px; margin-bottom: 12px; }
    .modal-title { font-size: 18px; font-weight: 900; margin-bottom: 8px; }
    .modal-text  { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
    .modal-cta {
      display: block;
      background: linear-gradient(135deg, #003DA6, #0057B7);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 900;
      padding: 15px;
      border-radius: 14px;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .modal-close {
      background: none; border: none;
      font-family: inherit; font-size: 13px;
      color: var(--muted); cursor: pointer; padding: 8px;
    }

    /* FAB */
    .fab {
      position: fixed; bottom: 90px; right: calc(50% - 185px);
      width: 52px; height: 52px;
      background: linear-gradient(145deg, #1270D8, #003DA6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(0,87,183,0.45);
      cursor: pointer; z-index: 40;
    }
    .fab .msym { color: #fff; font-size: 24px; }

    /* NAV */
    nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 390px;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 10px 8px 24px;
      display: flex; justify-content: space-around;
      z-index: 50;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none; flex: 1;
    }
    .nav-pill {
      padding: 6px 16px; border-radius: 100px;
      display: flex; align-items: center; justify-content: center;
    }
    .nav-item.active .nav-pill { background: var(--blue-soft); }
    .nav-item.active .msym { color: var(--blue); font-size: 23px; }
    .nav-item:not(.active) .msym { color: var(--muted); font-size: 23px; font-variation-settings: 'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; }
    .nav-lbl { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
    .nav-item.active .nav-lbl { color: var(--blue); }
    .nav-item:not(.active) .nav-lbl { color: var(--muted); }
  </style>
</head>

  <script>
    // =====================================================
    // FEED CONFIGURATION
    // =====================================================

    // The Guardian open API — free test key, proper CORS, no proxy needed
    var GUARDIAN = 'https://content.guardianapis.com/search?order-by=newest&page-size=15&show-fields=trailText&api-key=test&q=';

    function fetchGuardian(query) {
      return fetchWithTimeout(GUARDIAN + encodeURIComponent(query))
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (!data.response || data.response.status !== 'ok') throw new Error('bad response');
          var results = data.response.results || [];
          if (!results.length) throw new Error('no results');
          return results.map(function(r) {
            return {
              title:       r.webTitle || '',
              link:        r.webUrl   || '',
              pubDate:     r.webPublicationDate || '',
              description: (r.fields && r.fields.trailText) ? r.fields.trailText : '',
              author:      'The Guardian'
            };
          });
        });
    }

    // Parse RSS XML — used for direct Ukrainian source attempts
    function parseRSS(xmlStr) {
      try {
        var xml   = new DOMParser().parseFromString(xmlStr, 'text/xml');
        var nodes = Array.from(xml.querySelectorAll('item'));
        return nodes.slice(0, 15).map(function(n) {
          var linkEl   = n.querySelector('link');
          var linkText = linkEl ? linkEl.textContent.trim() : '';
          if (!linkText && linkEl && linkEl.nextSibling) {
            linkText = (linkEl.nextSibling.nodeValue || '').trim();
          }
          if (!linkText) {
            var guid = n.querySelector('guid');
            if (guid && guid.textContent.trim().indexOf('http') === 0) {
              linkText = guid.textContent.trim();
            }
          }
          return {
            title:       (n.querySelector('title')?.textContent       || '').trim(),
            link:        linkText,
            pubDate:     (n.querySelector('pubDate')?.textContent     || '').trim(),
            description: (n.querySelector('description')?.textContent || '').trim(),
            author:      (n.querySelector('author')?.textContent      ||
                          n.querySelector('dc\\:creator, creator')?.textContent || '').trim()
          };
        }).filter(function(item) { return item.title && item.link; });
      } catch (e) { return []; }
    }

    // Direct RSS fetch — works if the source allows CORS (no proxy)
    function fetchRSSDirect(url) {
      return fetchWithTimeout(url)
        .then(function(res) {
          if (!res.ok) throw new Error('http ' + res.status);
          return res.text();
        })
        .then(function(xmlStr) {
          var items = parseRSS(xmlStr);
          if (!items.length) throw new Error('no items parsed');
          return items;
        });
    }

    // Sample articles shown when all live sources fail
    var t = Date.now();
    var SAMPLES = {
      ukraine: [
        { title: "Ситуація на фронті: оперативна зведення",                        link: "https://suspilne.media", pubDate: new Date(t - 2*3600000).toUTCString(),  author: "Суспільне", description: "" },
        { title: "Переговори щодо безпекових гарантій для України",  link: "https://suspilne.media", pubDate: new Date(t - 5*3600000).toUTCString(),  author: "Суспільне", description: "" },
        { title: "Допомога від партнерів: нові пакети підтримки",              link: "https://suspilne.media", pubDate: new Date(t - 8*3600000).toUTCString(),  author: "Суспільне", description: "" },
        { title: "Українська діаспора: підтримка з європейських країн",  link: "https://suspilne.media", pubDate: new Date(t - 11*3600000).toUTCString(), author: "Суспільне", description: "" }
      ],
      netherlands: [
        { title: "Gemeenten zoeken woningen voor Oekraïense vluchtelingen",               link: "https://government.nl",             pubDate: new Date(t - 1*3600000).toUTCString(),  author: "Government.nl",    description: "" },
        { title: "Werk en bijstand: rechten van Oekraïners in Nederland",                 link: "https://government.nl",             pubDate: new Date(t - 4*3600000).toUTCString(),  author: "Government.nl",    description: "" },
        { title: "NT2-cursussen voor Oekraïners: aanmelden en kosten",                    link: "https://duo.nl",                    pubDate: new Date(t - 7*3600000).toUTCString(),  author: "DUO",              description: "" },
        { title: "Zorgverzekering voor vluchtelingen: stap voor stap uitgelegd",               link: "https://government.nl",             pubDate: new Date(t - 11*3600000).toUTCString(), author: "Government.nl",    description: "" }
      ]
    };

    // =====================================================
    // AUTO-TRANSLATION — unofficial Google Translate, CORS-enabled, no key needed
    // =====================================================
    function isUkrainian(text) {
      // Cyrillic range — BBC Ukrainian, Ukrinform, Suspilne are already in Ukrainian
      return /[Ѐ-ӿ]/.test(text || '');
    }

    function translateToUA(text) {
      if (!text || isUkrainian(text)) return Promise.resolve(text);
      var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=uk&dt=t&q='
                + encodeURIComponent(text);
      return fetchWithTimeout(url, 7000)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          return data[0].map(function(x) { return x[0]; }).join('');
        })
        .catch(function() { return text; });
    }

    function translateFeedItems(items) {
      if (!items || !items.length) return Promise.resolve(items);
      return Promise.all(items.map(function(item) {
        if (isUkrainian(item.title)) return Promise.resolve(item);
        return translateToUA(item.title).then(function(translated) {
          return Object.assign({}, item, { title: translated, translated: true });
        });
      }));
    }

    // Cloudflare Worker — твой персональный CORS-прокси, обходит все блокировки
    var WORKER = 'https://rss-proxy.marina-semirenko21.workers.dev/?url=';

    function fetchViaWorker(rssUrl) {
      return fetchWithTimeout(WORKER + encodeURIComponent(rssUrl))
        .then(function(res) {
          if (!res.ok) throw new Error('worker http ' + res.status);
          return res.text();
        })
        .then(function(xmlStr) {
          var items = parseRSS(xmlStr);
          if (!items.length) throw new Error('no items parsed');
          return items;
        });
    }

    var FEEDS = {
      ukraine: {
        id: 'ukraine',
        label: 'BBC Україна',
        accentColor: '#DC2626',
        keywords: ['україн','київ','харків','зеленсь','фронт','війн','бойов','окупац','ukraine','kyiv'],
        guardianQuery: 'ukraine war ceasefire military',
        workerSources: [
          // BBC Ukrainian — confirmed working ✅
          'https://feeds.bbci.co.uk/ukrainian/rss.xml',
          // Ukrinform — Ukrainian state news agency
          'https://www.ukrinform.ua/rss/block-lastnews',
          // Suspilne — Ukrainian public broadcaster
          'https://suspilne.media/rss/all.xml'
        ]
      },
      netherlands: {
        id: 'netherlands',
        label: 'NL Times',
        accentColor: '#15803D',
        keywords: ['ukraine','oekrain','nederland','refugee','housing','work','uitkering','wonen','integration','vluchtelingen'],
        guardianQuery: 'ukraine netherlands housing work integration refugees',
        workerSources: [
          // NL Times — English news specifically about the Netherlands
          'https://nltimes.nl/rss.xml',
          // DutchNews — English Netherlands news
          'https://www.dutchnews.nl/feed/',
          // NOS — Dutch public broadcaster
          'https://feeds.nos.nl/nosnieuwsalgemeen'
        ]
      }
    };

    // =====================================================
    // STATE
    // =====================================================
    var allArticles  = [];
    var feedHealth   = { ukraine: null, netherlands: null };
    var activeFilter = 'all';
    var isLoading    = false;

    // =====================================================
    // HTTP — fetch with timeout (broad browser compatibility)
    // =====================================================
    function fetchWithTimeout(url, ms) {
      ms = ms || 8000;
      var ctrl = new AbortController();
      var id   = setTimeout(function() { ctrl.abort(); }, ms);
      return fetch(url, { signal: ctrl.signal }).finally(function() { clearTimeout(id); });
    }

    // =====================================================
    // FEED LOADER — Worker (RSS) → Guardian (English) → samples
    // =====================================================
    function loadFeedWithFallback(feedCfg) {
      // Try each Worker source in sequence — stops at first success
      var workerAttempt = (feedCfg.workerSources || []).reduce(function(chain, url) {
        return chain.catch(function() {
          console.log('[Trying via Worker]', url);
          return fetchViaWorker(url);
        });
      }, Promise.reject(new Error('start')));

      return workerAttempt
        .then(function(items) {
          console.log('[Worker loaded ✅]', feedCfg.id);
          return translateFeedItems(items).then(function(tItems) {
            return { items: tItems, health: 'green', usedFallback: false };
          });
        })
        .catch(function(workerErr) {
          console.warn('[Worker failed for ' + feedCfg.id + ']', workerErr.message, '— trying Guardian');
          // Worker failed — try Guardian API (English, always works)
          return fetchGuardian(feedCfg.guardianQuery)
            .then(function(items) {
              return translateFeedItems(items).then(function(tItems) {
                return { items: tItems, health: 'amber', usedFallback: true };
              });
            })
            .catch(function() {
              // Both failed — show sample articles
              console.warn('[Using samples for ' + feedCfg.id + ']');
              return translateFeedItems(SAMPLES[feedCfg.id] || []).then(function(tItems) {
                return { items: tItems, health: 'amber', usedFallback: true };
              });
            });
        });
    }

    // =====================================================
    // VALIDATION AGENTS — 5 agents, run in parallel
    // =====================================================

    // Agent A: Reachability
    function agentA_reachability(result) {
      var ok = result.health !== 'red';
      console.log('[Agent A — Reachability] ' + (ok ? '✅' : '❌') + ' health=' + result.health);
      return ok;
    }

    // Agent B: Freshness — latest article < 48 hours old
    function agentB_freshness(items) {
      if (!items || !items.length) {
        console.log('[Agent B — Freshness] ❌ No items');
        return false;
      }
      var hoursOld = (Date.now() - new Date(items[0].pubDate).getTime()) / 3600000;
      var ok = hoursOld < 48;
      console.log('[Agent B — Freshness] ' + (ok ? '✅' : '⚠️') + ' ' + hoursOld.toFixed(1) + 'h ago');
      return ok;
    }

    // Agent C: Relevance — >20% of titles contain expected keywords
    function agentC_relevance(items, keywords) {
      if (!items || !items.length) {
        console.log('[Agent C — Relevance] ❌ No items');
        return false;
      }
      var matches = items.filter(function(item) {
        var text = ((item.title || '') + ' ' + (item.description || '')).toLowerCase();
        return keywords.some(function(kw) { return text.indexOf(kw.toLowerCase()) !== -1; });
      });
      var ratio = matches.length / items.length;
      var ok = ratio >= 0.2;
      console.log('[Agent C — Relevance] ' + (ok ? '✅' : '⚠️') + ' ' + matches.length + '/' + items.length + ' (' + (ratio * 100).toFixed(0) + '%)');
      return ok;
    }

    // Agent D: Link validity — article links start with http
    function agentD_links(items) {
      if (!items || !items.length) {
        console.log('[Agent D — Links] ❌ No items');
        return false;
      }
      var bad = items.slice(0, 5).filter(function(item) { return !item.link || item.link.indexOf('http') !== 0; }).length;
      var ok  = bad === 0;
      console.log('[Agent D — Links] ' + (ok ? '✅' : '⚠️') + ' ' + bad + ' bad links in first 5');
      return ok;
    }

    // Run Agents A-D in parallel, return aggregate health label
    function runValidationAgents(feedId, result) {
      return Promise.all([
        Promise.resolve(agentA_reachability(result)),
        Promise.resolve(agentB_freshness(result.items)),
        Promise.resolve(agentC_relevance(result.items, FEEDS[feedId].keywords)),
        Promise.resolve(agentD_links(result.items))
      ]).then(function(results) {
        var a = results[0], b = results[1], c = results[2], d = results[3];
        if (!a) return 'red';
        if (b && c && d) return 'green';
        return 'amber';
      });
    }

    // =====================================================
    // MAIN LOAD ORCHESTRATOR
    // =====================================================
    function loadAllFeeds() {
      if (isLoading) return;
      isLoading = true;
      setRefreshLoading(true);
      setStatusLoading();
      showSkeleton();

      var feedKeys = Object.keys(FEEDS);

      // Load all 3 feeds in parallel
      Promise.allSettled(
        feedKeys.map(function(key) { return loadFeedWithFallback(FEEDS[key]); })
      ).then(function(loadResults) {
        allArticles = [];

        // Run validation agents in parallel for each feed, collect articles
        return Promise.allSettled(
          feedKeys.map(function(key, i) {
            var result = loadResults[i].status === 'fulfilled'
              ? loadResults[i].value
              : { items: [], health: 'red', usedFallback: false };

            return runValidationAgents(key, result).then(function(health) {
              feedHealth[key] = health;
              (result.items || []).forEach(function(item) {
                allArticles.push(Object.assign({}, item, { feedId: key }));
              });
            });
          })
        );
      }).then(function() {
        allArticles.sort(function(a, b) { return new Date(b.pubDate) - new Date(a.pubDate); });
        isLoading = false;
        setRefreshLoading(false);
        updateHealthIndicators();
        updateStatusText();
        renderArticles();
      });
    }

    // =====================================================
    // RENDER
    // =====================================================
    function showSkeleton() {
      var html = '';
      for (var i = 0; i < 6; i++) {
        html += '<div class="skeleton-card">' +
          '<div class="skel-line skel-meta"></div>' +
          '<div class="skel-line skel-t1"></div>' +
          '<div class="skel-line skel-t2"></div>' +
          '<div class="skel-line skel-action"></div>' +
          '</div>';
      }
      document.getElementById('articles-container').innerHTML = html;
    }

    function renderArticles() {
      var container = document.getElementById('articles-container');

      var filtered = activeFilter === 'all'
        ? allArticles
        : allArticles.filter(function(a) { return a.feedId === activeFilter; });

      if (!filtered.length) {
        var allFailed = Object.keys(feedHealth).every(function(k) { return feedHealth[k] === 'red'; });
        container.innerHTML =
          '<div class="error-state">' +
          '<div class="error-icon">' + (allFailed ? '📡' : '😔') + '</div>' +
          '<div class="error-title">' + (allFailed ? 'Немає зʼєднання' : 'Немає статей') + '</div>' +
          '<div class="error-sub">' + (allFailed
            ? 'Перевірте підключення до інтернету і спробуйте знову'
            : 'Спробуйте іншу категорію або оновіть пізніше') + '</div>' +
          '<button class="error-retry" onclick="loadAllFeeds()">Спробувати знову</button>' +
          '</div>';
        return;
      }

      container.innerHTML = filtered.map(function(item, i) {
        return renderArticleCard(item, i === 0 && activeFilter === 'all');
      }).join('');
    }

    function renderArticleCard(item, isFeatured) {
      var feed      = FEEDS[item.feedId];
      var title     = strip(item.title);
      var timeStr   = timeAgo(item.pubDate);
      var source    = strip(item.author || feed.label);
      var featured  = isFeatured ? ' featured' : '';

      var meta =
        '<div class="article-meta">' +
        '<span class="cat-dot" style="background:' + feed.accentColor + '"></span>' +
        '<span class="article-source">' + source + '</span>' +
        '<span class="article-time">' + timeStr + '</span>' +
        (item.translated ? '<span class="transl-badge">🇺🇦</span>' : '') +
        '</div>' +
        '<div class="article-title">' + title + '</div>';

      return '<a href="' + item.link + '" target="_blank" rel="noopener noreferrer" ' +
        'class="article-card article-unlocked' + featured + '">' +
        meta +
        '<div class="article-read-btn">Читати <span class="msym">arrow_forward</span></div>' +
        '</a>';
    }

    // =====================================================
    // HELPERS
    // =====================================================
    function strip(html) {
      return (html || '')
        .replace(/<[^>]*>/g, '')
        .replace(/&amp;/g,  '&')
        .replace(/&lt;/g,   '<')
        .replace(/&gt;/g,   '>')
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g,  "'")
        .replace(/&nbsp;/g, ' ')
        .trim();
    }

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      var d = new Date(dateStr);
      // Some feeds use non-standard formats — try parsing manually if needed
      if (isNaN(d.getTime())) {
        // Try stripping timezone abbreviations like "CET", "EST" that Date() chokes on
        d = new Date(dateStr.replace(/\s[A-Z]{2,4}$/, ''));
      }
      if (isNaN(d.getTime())) return '';
      var diff  = Date.now() - d.getTime();
      if (diff < 0) return 'щойно';
      var mins  = Math.floor(diff / 60000);
      var hours = Math.floor(diff / 3600000);
      var days  = Math.floor(diff / 86400000);
      if (mins < 2)   return 'щойно';
      if (mins < 60)  return mins + ' хв тому';
      if (hours < 24) return hours + ' год тому';
      return days + ' дн тому';
    }

    function updateHealthIndicators() {
      Object.keys(feedHealth).forEach(function(key) {
        var dot = document.getElementById('health-' + key);
        if (dot) dot.className = 'health-dot ' + (feedHealth[key] || '');
      });
    }

    function updateStatusText() {
      var allRed   = Object.keys(feedHealth).every(function(k) { return feedHealth[k] === 'red'; });
      var anyAmber = Object.keys(feedHealth).some(function(k) { return feedHealth[k] === 'amber'; });
      var dot  = document.getElementById('live-dot');
      var text = document.getElementById('status-text');

      if (allRed) {
        dot.className    = 'live-dot error';
        text.textContent = 'Помилка завантаження';
      } else {
        var now = new Date();
        var hh  = String(now.getHours()).padStart(2, '0');
        var mm  = String(now.getMinutes()).padStart(2, '0');
        dot.className    = 'live-dot';
        text.textContent = 'Оновлено ' + hh + ':' + mm + (anyAmber ? ' (часткові дані)' : '');
      }
    }

    function setStatusLoading() {
      document.getElementById('live-dot').className = 'live-dot loading';
      document.getElementById('status-text').textContent = 'Завантаження...';
    }

    function setRefreshLoading(loading) {
      document.getElementById('refresh-btn').classList.toggle('loading', loading);
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.filter === filter);
      });
      renderArticles();
    }

    function triggerRefresh() { loadAllFeeds(); }

    // =====================================================
    // INIT + AUTO-REFRESH every 10 minutes
    // =====================================================
    loadAllFeeds();
    setInterval(loadAllFeeds, 10 * 60 * 1000);
  </script>

</body>
