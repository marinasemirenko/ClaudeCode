<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-помічник — RAZOM</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F9FA; --card: #FFFFFF; --text: #111827; --muted: #6B7280;
      --border: #E5E2DA; --blue: #0057B7; --blue-soft: #E8F0FF;
      --yellow: #FCD400; --pink: #DB2777; --pink-soft: #FCE7F3;
    }
    body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .msym { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; font-size: 22px; line-height: 1; }
    .msym.o { font-variation-settings: 'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; }
    .flag-bar { height: 3px; background: linear-gradient(90deg, var(--blue) 50%, var(--yellow) 50%); flex-shrink: 0; }

    header { background: var(--card); padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text); flex-shrink: 0; }
    .back-btn .msym { font-size: 18px; }
    .header-title { font-size: 16px; font-weight: 900; color: var(--text); }

    .soon-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 28px; gap: 6px; }
    .soon-icon { width: 76px; height: 76px; border-radius: 26px; background: linear-gradient(145deg, #F472B6, #831843); display: flex; align-items: center; justify-content: center; font-size: 34px; margin-bottom: 14px; box-shadow: 0 10px 28px rgba(131,24,67,0.28); }
    .soon-title { font-size: 18px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .soon-text { font-size: 13px; color: var(--muted); font-weight: 500; line-height: 1.6; max-width: 290px; margin-bottom: 22px; }
    .soon-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--blue); color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; padding: 13px 24px; border-radius: 100px; box-shadow: 0 6px 18px rgba(0,87,183,0.3); }
    .soon-btn .msym { font-size: 18px; }
  </style>
</head>
<body>
<div class="flag-bar"></div>
<header>
  <a href="javascript:history.back()" class="back-btn"><span class="msym o">arrow_back</span></a>
  <div class="header-title">AI-помічник</div>
</header>

<div class="soon-wrap">
  <div class="soon-icon">🤖</div>
  <div class="soon-title">AI-помічник скоро з'явиться</div>
  <div class="soon-text">Ми готуємо особистого помічника, який відповідатиме на твої питання українською — про права, документи, медицину, роботу і життя в Нідерландах. Зовсім скоро він буде тут.</div>
  <a href="1final_colorful.html" class="soon-btn"><span class="msym o">explore</span> Перейти до розділів</a>
</div>

  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
</body>
</html>
