<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="r"><rect width="512" height="512" rx="90"/></clipPath>
  </defs>
  <!-- Ukrainian flag: blue top, yellow bottom -->
  <rect width="512" height="512" fill="#0057B7" clip-path="url(#r)"/>
  <rect y="384" width="512" height="128" fill="#FCD400" clip-path="url(#r)"/>
  <!-- Letter R -->
  <text x="256" y="328" text-anchor="middle" transform="scale(1.08 1.06)" transform-origin="256 328"
        font-family="-apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700" font-size="318" fill="white">R</text>
</svg>
